openapi: 3.0.3
info:
  title: Mountain Hut API
  version: 0.2.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Backend API of the Mountain Hut web application (SE2 project, Team 15).

    ## General conventions

    * **Errors** - every error response has the `Error` body: `{"error": "message"}`.
      `401` = not logged in; `403` = logged in but the role is not allowed
      (the warden passes every employee check); `404` is also returned for a
      resource that exists but belongs to someone else, so it does not reveal
      that it exists.
    * **Authentication** - cookie-based session (`sessionCookie`). The cookie is
      set by `POST /api/auth/register` and `POST /api/auth/login` (httpOnly,
      sameSite=lax) and is accepted by every endpoint marked with
      `sessionCookie` security.
    * **Dates and times** - dates are valid calendar dates in `YYYY-MM-DD`
      format, and times are `HH:MM` (24 h), both in hut local time (`TZ`,
      default Europe/Rome); `createdAt` is ISO 8601 UTC. Dates that do not
      exist on the calendar are invalid and date-taking endpoints return `400`.
      A client may display 12-hour times locally, but it must convert back to
      `HH:MM` before calling the API.
    * **Slot time rules** - a new slot must start strictly after the current
      hut-local time. A slot is `past` once its start time is at or before the
      current hut-local time.
    * **Booking window** - there is no maximum advance-booking window. A hiker
      can book any staff-defined slot up to 2 hours before its start; within
      2 hours, the slot is no longer bookable and `POST /api/bookings` returns
      `400`.
    * **Allocation rule** - first try to seat the whole party at one table,
      possibly sharing it with other parties. Split the party only when no
      single table has enough free seats; then use as few tables as possible,
      leaving the fewest unused free seats on the selected tables. On a tie,
      use the lowest table ids. There is no minimum party size per table or
      requirement that selected tables be adjacent. Example: tables 6, 4, 4,
      party of 8 → the two 4s; party of 5 → the 6. The availability check and
      booking use the same rule.
    * **Unknown routes** - any request under `/api` that matches no path+method
      below returns `404` with the `Error` body.
    * **Test-only routes** - endpoints tagged `test-utils` exist only when
      `NODE_ENV` is `test` or `e2e`; they are never part of a release build.
    * **Change window (MH-06)** - a booking can be changed only while at least
      48 hours remain before its slot starts (PO, issue #43: for a meal on
      20 Nov at 13:00, changes close on 18 Nov at 13:00, that instant included).
      A change must also respect the one-booking-per-slot rule. Cancelling
      (MH-08) has **no** time limit (PO, issue #8).
    * **Emails (MH-03, MH-06, MH-08)** - every change to a booking is notified
      by email to the hiker (PO, issue #41, MH-06 clarification): a new booking,
      a change and a cancellation each send one email, after the commit; if
      the email fails, the operation stays valid.
    * **Party requirements (MH-05)** - a booking has a list of requirements,
      each with its own allergies flag (a checkbox set by the hiker, PO issue #4)
      and a description (PO issue #29). The list may be empty.
    * **Hikers created by staff (MH-07)** - staff can book for a hiker who is
      not registered. Quick entry (name and optional phone) creates a temporary
      hiker, with no email and no password, who cannot log in (PO issue #5).
      Full details create a regular hiker profile with a **randomly generated
      password**: it is shown once to the staff member, who gives it to the
      hiker (e.g. verbally); the hiker must change it at the next login and
      can recover it by email (PO issue #36, MH-07 clarification).
    * **Health** - `GET /api/health` answers when the server is up, for the
      Docker health check and monitoring (no login, no database work).

    Version 0.2.0 (Sprint 2, U1) adds the endpoints of MH-05 → MH-09, updated
    with the PO answers of 9-12 Nov (issues #35-#45 and the story
    clarifications). Still **pending PO**: question 2 of the planning (can a
    change move a booking into, or out of, a slot that starts within 2 hours?)
    and question 6 (limits on the requirements); issue #46 (generated password
    sent by email instead of verbally).

servers:
  - url: http://localhost:3001
    description: Local development (the Vite dev server proxies /api here)

# Endpoints without an explicit `security` (logout, me) accept the session
# cookie by default; public endpoints override it with `security: []`.
security:
  - sessionCookie: []

tags:
  - name: auth
    description: Registration, login, logout and current user
  - name: public
    description: >
      Anonymous endpoints (no login), grouped under /api/public so they never
      pass through the staff router. SlotPicker data.
  - name: bookings
    description: Table bookings
  - name: slots
    description: Slot and table management, staff only
  - name: staff
    description: Bookings entered by staff for hikers (MH-07), staff only
  - name: test-utils
    description: Only available when NODE_ENV is test/e2e

paths:

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new hiker (and log them in)
      description: >
        Creates a hiker account only (staff accounts are created by the seed).
        On success the user is already logged in: the response sets the
        session cookie. Hiker registration requires first name, last name,
        email, password and mobile number. Notes and emergency-contact details
        are optional.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
            example:
              firstName: Mario
              lastName: Rossi
              email: mario.rossi@example.com
              password: segretissimopw
              phone: '+39 333 0000000'
              notes: Registered mountain guide
              emergencyContact: '+39 333 0000001'
      responses:
        '201':
          description: User created and logged in; sets the session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: >
            Missing or invalid body: missing required registration details,
            email not well formed, or password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Password must be at least 8 characters long'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Email already in use'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
            example:
              email: mario.rossi@example.com
              password: segretissimopw
      responses:
        '200':
          description: Logged in; sets (refreshes) the session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing email or password, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Email and password are required'
        '401':
          description: Wrong email or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Invalid email or password'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: Destroys the session and expires the cookie. Idempotent.
      operationId: logout
      responses:
        '204':
          description: Logged out (also when no session was active)

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current logged-in user
      operationId: getCurrentUser
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Not logged in'

  /api/auth/password:
    put:
      tags: [auth]
      summary: Change your own password (MH-07, forced change after a generated one)
      description: >
        Any logged-in user with a password. A hiker created by staff gets a
        random password and **must change it at the next login** (PO issue
        #36, MH-07 clarification): until then `User.mustChangePassword` is
        true and the client opens the change-password page right after login.
        The current password is checked; the new one follows the registration
        rule (at least 8 characters) and must differ from the current one.
        On success `mustChangePassword` becomes false and the session stays
        logged in. (Recovery of a forgotten password by email, also mentioned
        in the clarification, is not part of this contract.)
      operationId: changePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            example:
              currentPassword: k7Qp2xWm9aTz
              newPassword: my-own-secret-pw
      responses:
        '200':
          description: Password changed; the updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: >
            Missing fields, new password shorter than 8 characters, or equal to
            the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Password must be at least 8 characters long'
        '401':
          description: Not logged in, or the current password is wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'The current password is wrong'

  /api/health:
    get:
      tags: [public]
      summary: Health check (Docker, monitoring)
      description: >
        Answers 200 as soon as the server accepts requests. No login, no
        database work and no other side effect, so it is cheap to call every
        few seconds. Used by the Docker HEALTHCHECK instead of an application
        route, which could change (review of #41/#42).
      operationId: health
      security: []
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok

  /api/public/slots:
    get:
      tags: [public]
      summary: All meal slots on a day
      description: >
        Used by the SlotPicker (date → time → party size) on both the
        availability page and the booking page. All slots with status `open`
        are returned, including full slots and slots that have started or start
        within 2 hours. `bookingState` is `tooLate` when booking is closed,
        otherwise `full` when no seats remain, or `bookable`. The SlotPicker
        disables full and too-late slots and shows the reason. No seat counts
        are exposed. A hut may define multiple slots per day with different
        start times and durations; there is no fixed meal schedule.
      operationId: listPublicSlots
      security: []
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: All slots of the day, ordered by start time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSlot'
              example:
                - id: 3
                  label: Lunch
                  startTime: '12:00'
                  endTime: '14:00'
                  bookingState: tooLate
                - id: 4
                  label: Dinner - 1st turn
                  startTime: '19:00'
                  endTime: '20:30'
                  bookingState: full
                - id: 5
                  label: Dinner - 2nd turn
                  startTime: '21:00'
                  endTime: '22:30'
                  bookingState: bookable
        '400':
          description: Missing or invalid date (not a valid YYYY-MM-DD calendar date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'date must be YYYY-MM-DD'

  /api/public/slots/{id}/availability:
    get:
      tags: [public]
      summary: Is there room for a party in this slot, and how would they sit?
      description: >
        Sub-resource of a public slot: the check always concerns one slot,
        so the slot (`{id}`, its numeric id) is the path and the party size
        the query. Checks one slot
        only and never suggests alternatives (PO). A closed
        slot, a slot in the past, or a slot starting within 2 hours answers
        `200` with `available: false` and an empty `split` - never an error,
        so the answer can be shown in place of the check result. Each item of
        `split` lists the tables selected by the allocation rule and the
        party seats assigned to each. Show hikers the seat split, not table
        names.
      operationId: checkAvailability
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/PartySize'
      responses:
        '200':
          description: Availability of the slot for the given party
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                available:
                  summary: Party fits, split over three tables
                  value:
                    available: true
                    split:
                      - { slotTableId: 9, tableName: T1, seats: 2 }
                      - { slotTableId: 7, tableName: T2, seats: 3 }
                      - { slotTableId: 8, tableName: T3, seats: 1 }
                closedOrTooLate:
                  summary: Slot closed, already started, or starting within 2 hours
                  value:
                    available: false
                    split: []
                notAvailable:
                  summary: Slot open but not enough seats for the party
                  value:
                    available: false
                    split: []
        '400':
          description: >
            `id` in the path is not a positive integer, or missing/invalid
            partySize (partySize < 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'partySize must be a positive integer'
        '404':
          description: Unknown slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Slot not found'

  /api/bookings:
    get:
      tags: [bookings]
      summary: The logged-in hiker's own bookings (MH-06)
      description: >
        Hikers only. Every booking of the logged-in hiker, confirmed and
        cancelled: upcoming ones first (soonest first), then past ones (most
        recent first). Each booking has `changeable`, so the "My bookings" page
        can enable or disable its Change button without repeating the rules.
        Staff receive 403 (they have no bookings of their own).
      operationId: listMyBookings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The hiker's bookings (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyBooking'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in but not a hiker (employee or warden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Only hikers have bookings'

    post:
      tags: [bookings]
      summary: Book a table for a party
      description: >
        Hikers only. The server re-reads the seats inside a transaction and
        assigns tables with the allocation rule. A slot holds its tables for
        its entire duration. A hiker may have at most one booking for a given
        slot. A booking for a slot starting within 2 hours is refused with 400. 
        Party requirements (MH-05) are optional and are saved in the same
        transaction as the booking.
        On success, the confirmation email hook is called after the commit: 
        if the email fails, the booking stays valid.
      operationId: createBooking
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
            example:
              slotId: 3
              partySize: 7
              requirements:
                - { hasAllergies: true, description: '1 vegan, peanut allergy' }
                - { hasAllergies: true, description: '1 shellfish allergy' }
                - { hasAllergies: false, description: '2 vegetarians' }
      responses:
        '201':
          description: Booking created and confirmed
          headers:
            Location:
              description: Path of the new booking
              schema:
                type: string
                example: /api/bookings/100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: >
            Invalid body, slot not open, or the slot starts in less than
            2 hours. Invalid requirements (not a list, a missing allergies
            flag, an empty description) are an invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closed:
                  value: { error: 'This slot is closed' }
                deadline:
                  value: { error: 'Bookings are accepted up to 2 hours before the slot starts' }
                requirement:
                  value: { error: 'Each requirement needs hasAllergies (true or false) and a description' }
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in but not a hiker (employee or warden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Only hikers can book'
        '404':
          description: Unknown slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Slot not found'
        '409':
          description: >
            The party does not fit in the remaining free seats (including
            when another booking took seats before validation), or this hiker
            already has a booking for this slot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notAvailable:
                  value: { error: 'Not enough seats available for this party' }
                alreadyBooked:
                  value: { error: 'You already have a booking for this slot' }

  /api/bookings/{id}:
    get:
      tags: [bookings]
      summary: Read one booking (owner only)
      description: >
        Only the hiker who made the booking can read it. All other users,
        including staff, receive 404 so the existence of another person's
        booking is not revealed.
      operationId: getBooking
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The booking with its slot and tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The booking id is not a positive integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'id must be a positive integer'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown booking, or booking of another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Booking not found'

    patch:
      tags: [bookings]
      summary: Change a booking (MH-06, owner only)
      description: >
        Only the hiker who made the booking; anyone else receives 404 (as for
        GET). Any of `slotId`, `partySize` and `requirements` can be sent;
        what is not sent stays as it is. A cancelled booking cannot be
        changed. Rules: the change window (at least 48 hours before the
        booked slot starts, PO issue #43); the new slot, if any, must be
        bookable like a new booking (open, not within 2 hours: whether it must
        also be 48 hours away is **pending PO**, planning question 2); one
        booking per hiker per slot. When the slot or the party size changes,
        the change is treated as a new booking in that slot (PO issue #38,
        MH-06 clarification): this booking's own seats are released, the
        tables are assigned again with the allocation rule, and if the party
        does not fit the answer is 409 and the booking stays exactly as it was
        (one transaction). `requirements`, when sent, replaces the whole list
        (an empty list removes them). `createdAt` does not change. After the
        commit the hiker gets an email with the new details (PO issue #41).
      operationId: changeBooking
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingChange'
            example:
              partySize: 6
      responses:
        '200':
          description: The changed booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: >
            Invalid body (nothing to change, invalid values or requirements),
            booking cancelled, less than 48 hours before the booked slot, or
            the new slot is closed or starts within 2 hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nothing:
                  value: { error: 'Nothing to change' }
                cancelled:
                  value: { error: 'A cancelled booking cannot be changed' }
                window:
                  value: { error: 'Bookings can be changed up to 48 hours before the slot starts' }
                deadline:
                  value: { error: 'Bookings are accepted up to 2 hours before the slot starts' }
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown booking, booking of another user, or unknown new slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                booking:
                  value: { error: 'Booking not found' }
                slot:
                  value: { error: 'Slot not found' }
        '409':
          description: >
            The party does not fit in the free seats of the (new) slot, without
            counting this booking's own seats, or the hiker already has another
            booking for the new slot. The booking is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notAvailable:
                  value: { error: 'Not enough seats available for this party' }
                alreadyBooked:
                  value: { error: 'You already have a booking for this slot' }

  /api/bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancel a booking (MH-08, owner only)
      description: >
        Only the hiker who made the booking; anyone else receives 404. Allowed
        at any time, also after the slot started (PO, issue #8 and MH-08
        clarification). The status becomes `cancelled` and its seats are free
        again for availability and new bookings. A POST on a sub-resource and
        not DELETE: the booking is kept (status `cancelled`), it is not
        removed. Cancelling an already cancelled booking is refused with 409,
        so a double click is visible and harmless. After the commit the hiker
        gets an email saying the booking is cancelled (PO issue #41).
      operationId: cancelBooking
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The booking, now with status cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The booking id is not a positive integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'id must be a positive integer'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown booking, or booking of another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Booking not found'
        '409':
          description: The booking is already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'This booking is already cancelled'

  /api/slots:
    get:
      tags: [slots]
      summary: Slots of a date range, with their tables
      description: >
        Employee and warden only (the warden passes every employee check);
        hikers receive 403.
        Used by the weekly view (past days greyed out, `past` flag) and by the
        "copy tables from" menu of the new-slot form. Slots can have different
        table layouts; staff may reuse a previous slot's table configuration,
        and there is no single fixed table set. No slot detail endpoint exists for
        the moment: the tables are read from this list.
      operationId: listSlots
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          description: First valid calendar date, YYYY-MM-DD (inclusive)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-11-02'
        - name: to
          in: query
          required: true
          description: Last valid calendar date, YYYY-MM-DD (inclusive)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-11-08'
      responses:
        '200':
          description: >
            Slots ordered by date, then start time; `tables` ordered by natural
            name order (text alphabetically, digit sequences numerically, e.g.
            T2 before T10).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '400':
          description: >
            Missing or invalid calendar dates, `to` before `from`, or a range
            longer than 31 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'The range cannot exceed 31 days'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in but not staff (hiker)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Staff only'

    post:
      tags: [slots]
      summary: Create a meal slot with its tables
      description: >
        Employee and warden only; hikers receive 403. The slot must start
        strictly after the current hut-local time and must not overlap any
        existing slot of the same day (adjacent turns are allowed:
        end == next start). Each slot has its own table configuration and may
        reuse a previous slot's configuration. A slot has at least one table;
        table names are unique within the slot.
      operationId: createSlot
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSlot'
            example:
              date: '2026-11-02'
              startTime: '19:00'
              endTime: '20:30'
              label: Dinner - 1st turn
              tables:
                - { name: T1, seats: 4 }
                - { name: T2, seats: 4 }
                - { name: T3, seats: 6 }
      responses:
        '201':
          description: Slot created with its tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          description: >
            Invalid body: missing or invalid calendar date, malformed
            date/times, end not after start, slot not starting in the future,
            missing or empty label, no tables, duplicated table names,
            seats < 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                endBeforeStart:
                  value: { error: 'endTime must be after startTime' }
                duplicatedNames:
                  value: { error: 'Table names must be unique within the slot' }
                noTables:
                  value: { error: 'A slot needs at least one table' }
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in but not staff (hiker)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The slot overlaps an existing slot of the same day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Overlaps an existing slot'

  /api/slots/copy-week:
    post:
      tags: [slots]
      summary: Copy every slot of a week, with its tables, into another week (MH-09)
      description: >
        Employee and warden only; hikers receive 403. Weeks are Monday to
        Sunday: `sourceWeek` and `targetWeek` are any date of the two weeks
        (the server uses their Mondays). Each slot of the source week is
        created on the same weekday of the target week, with the same times,
        label and tables; bookings are never copied.
        **Existing schedule (PO, issue #45, MH-09 clarification):** "it is not
        possible to copy a weekly schedule onto an existing schedule unless
        there are no reservations; in this case it completely replaces the
        existing one". So: if any slot of the target week that has not started
        yet has a confirmed booking, the copy is refused with 409 and nothing
        changes; otherwise those slots are deleted and replaced by the copy.
        Slots of the target week that already started are never touched, and a
        source slot whose day/time in the target week is not in the future is
        skipped (`reason: past`). Everything happens in one transaction.
        Adjusting a copied slot afterwards is MH-19, a later story.
      operationId: copyWeek
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyWeek'
            example:
              sourceWeek: '2026-11-09'
              targetWeek: '2026-11-16'
      responses:
        '201':
          description: >
            Copy done: the slots created (possibly none), the existing slots of
            the target week that were replaced, and the source slots skipped
            because they would be in the past.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyWeekResult'
        '400':
          description: >
            Missing or invalid dates, or the same week as source and target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sameWeek:
                  value: { error: 'Choose a different week to copy into' }
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in but not staff (hiker)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Staff only'
        '409':
          description: >
            The target week already has a schedule with at least one booking
            in a slot that has not started: it cannot be replaced (PO, issue
            #45). Nothing is created or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'The target week has bookings: its schedule cannot be replaced'

  /api/staff/hikers:
    get:
      tags: [staff]
      summary: Search hikers by name, phone or email (MH-07)
      description: >
        Employee and warden only; hikers receive 403. Case-insensitive search
        of `q` in first name, last name, "first last", email and phone (spaces
        in the phone ignored). Only hikers are returned (also temporary ones),
        at most 20, ordered by last name then first name. Used by the hiker
        panel of the staff reservation page.
      operationId: searchHikers
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          description: Text to look for, at least 2 characters after trimming
          schema:
            type: string
            minLength: 2
          example: rossi
      responses:
        '200':
          description: Matching hikers (possibly empty)
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/HikerSummary'
        '400':
          description: Missing or too short `q`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Type at least 2 characters to search'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in but not staff (hiker)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Staff only'

  /api/staff/bookings:
    post:
      tags: [staff]
      summary: Book for a hiker - existing, new or temporary (MH-07)
      description: >
        Employee and warden only; hikers receive 403. Exactly one of three
        ways to say who the booking is for:
        `hikerId` (an existing hiker, from the search), `newHiker` (full
        details: a regular hiker profile is created, who can later log in), or
        `temporaryHiker` (first name and optional phone: a temporary hiker
        without email or password, who cannot log in, PO issue #5). Then the
        same allocation and rules as `POST /api/bookings` (one booking per
        hiker per slot, seats checked in the transaction, requirements),
        **except the 2-hour rule**: staff can book up to the start of the slot,
        not after (PO issue #35, MH-07 clarification: "they cannot be made
        after the beginning of the time slot"). The new hiker, if any, and the
        booking are created in one transaction: when the booking is refused,
        no hiker is created.
        **New full hiker:** the server generates a random password (staff do
        not choose it) and returns it **once** in `generatedPassword`, for the
        staff member to give to the hiker (e.g. verbally, PO issue #36). The
        hiker must change it at the first login (`mustChangePassword`, see
        `PUT /api/auth/password`). Whether the system may email it instead is
        **pending PO** (issue #46).
        **Email:** a hiker with an email (existing or new full) gets the
        booking confirmation (MH-03; any reservation change is notified, PO
        issue #41); a temporary hiker has no email, so none is sent.
      operationId: createStaffBooking
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffBooking'
            examples:
              existing:
                value: { hikerId: 4, slotId: 3, partySize: 2 }
              temporary:
                value:
                  temporaryHiker: { firstName: Giulia, phone: '+39 333 7654321' }
                  slotId: 3
                  partySize: 4
                  requirements: [{ hasAllergies: false, description: '2 vegetarians' }]
              newFullHiker:
                value:
                  newHiker:
                    firstName: Paolo
                    lastName: Neri
                    email: paolo.neri@example.com
                    phone: '+39 333 5551234'
                  slotId: 3
                  partySize: 2
      responses:
        '201':
          description: >
            Booking created; the answer also says for whom, and carries the
            generated password when a new full hiker was created (shown once,
            never stored in clear or returned again).
          headers:
            Location:
              description: Path of the new booking
              schema:
                type: string
                example: /api/bookings/101
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffBooking'
        '400':
          description: >
            Invalid body: not exactly one of hikerId / newHiker / temporaryHiker,
            invalid hiker details, invalid slot, party size or requirements,
            slot closed or already started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                who:
                  value: { error: 'Give exactly one of hikerId, newHiker or temporaryHiker' }
                started:
                  value: { error: 'This slot has already started' }
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Logged in but not staff (hiker)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Staff only'
        '404':
          description: Unknown slot, or `hikerId` that is not a hiker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slot:
                  value: { error: 'Slot not found' }
                hiker:
                  value: { error: 'Hiker not found' }
        '409':
          description: >
            Not enough seats, the hiker already has a booking for this slot, or
            the email of `newHiker` is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notAvailable:
                  value: { error: 'Not enough seats available for this party' }
                alreadyBooked:
                  value: { error: 'This hiker already has a booking for this slot' }
                email:
                  value: { error: 'Email already in use' }

  /api/test/emails:
    get:
      tags: [test-utils]
      summary: Emails captured by the test mailer
      description: >
        Available only when NODE_ENV is test or e2e; in any other environment
        the route is not mounted at all. Used by the tests to assert that a
        booking triggers exactly one confirmation email.
      operationId: listCapturedEmails
      security: []
      parameters:
        - name: recipient
          in: query
          required: false
          description: Filter by recipient address
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Captured emails, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapturedEmail'
        '404':
          description: Route not mounted outside test/e2e environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'No API endpoint for GET /api/test/emails'
    delete:
      tags: [test-utils]
      summary: Empty the captured mailbox
      description: >
        Available only when NODE_ENV is test or e2e; in any other environment
        the route is not mounted at all. Removes every captured email, so each
        E2E test can start from an empty mailbox and count exactly the emails
        its own booking sent. Added by MH-03 BE1 (not in the first version of
        the contract).
      operationId: clearCapturedEmails
      security: []
      responses:
        '204':
          description: Mailbox emptied
        '404':
          description: Route not mounted outside test/e2e environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'No API endpoint for DELETE /api/test/emails'

components:
  parameters:
    Date:
      name: date
      in: query
      required: true
      description: Valid calendar date of the meal, YYYY-MM-DD, hut local time
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      example: '2026-11-02'
    Id:
      name: id
      in: path
      required: true
      description: >
        Numeric resource id: a slot under /api/public/slots, a booking under
        /api/bookings (also /api/bookings/{id}/cancel). The path segment before
        it names the resource type.
      schema:
        type: integer
        minimum: 1
      example: 100
    PartySize:
      name: partySize
      in: query
      required: true
      description: >
        Size of the whole party, the hiker included. At least 1; no upper
        limit for now (the slot capacity is the real limit).
      schema:
        type: integer
        minimum: 1
      example: 3

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: >
        Express session cookie (httpOnly, sameSite=lax), set by register and
        login, stored in sessions.db. In development the client goes through
        the Vite proxy, so the cookie is same-origin and CORS is never needed.

  schemas:
    User:
      type: object
      description: >
        A user as seen by the client. Never contains the password or its hash.
        Notes and emergency-contact details are optional hiker profile fields.
      required: [id, firstName, lastName, email, phone, role]
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: Mario
        lastName:
          type: string
          example: Rossi
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        phone:
          type: string
          nullable: true
          description: Optional for staff, required for hikers. Must be a valid mobile number.
          example: '+39 333 1234567'
        notes:
          type: string
          nullable: true
          description: Optional notes on a hiker's profile.
        emergencyContact:
          type: string
          nullable: true
          description: Optional free-text emergency-contact details.
        role:
          type: string
          enum: [hiker, employee, warden]
          example: hiker
        mustChangePassword:
          type: boolean
          description: >
            True for a hiker whose password was generated by staff (MH-07)
            until they change it with `PUT /api/auth/password`; the client
            sends them to the change-password page after login. Absent or
            false for everyone else.
          example: false

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          example: k7Qp2xWm9aTz
        newPassword:
          type: string
          format: password
          minLength: 8
          example: my-own-secret-pw

    NewUser:
      type: object
      description: >
        Hiker registration form. Mobile number is required; notes and
        emergency-contact details are optional.
      required: [firstName, lastName, email, password, phone]
      properties:
        firstName:
          type: string
          minLength: 1
          example: Mario
        lastName:
          type: string
          minLength: 1
          example: Rossi
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Plain over the wire; stored as salt + scrypt hash, never logged or returned.
          example: segretissimopw
        phone:
          type: string
          format: phone number
          example: '+39 333 1234567'
        notes:
          type: string
          nullable: true          
          description: Optional notes on the hiker's profile.
        emergencyContact:
          type: string
          nullable: true
          description: Optional free-text emergency-contact details.

    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          example: segretissimopw

    PublicSlot:
      type: object
      description: Open slot, as shown in the SlotPicker "time" menu.
      required: [id, startTime, endTime, label, bookingState]
      properties:
        id:
          type: integer
          example: 3
        label:
          type: string
          example: Lunch
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '12:00'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '14:00'
        bookingState:
          type: string
          description: >
            `tooLate` when the slot has started or starts within 2 hours;
            `full` when no seats remain; else `bookable` .
          enum: [bookable, full, tooLate]
          example: bookable

    Availability:
      type: object
      description: >
        Result of a seat check for one slot and one party. `split` is the
        proposed seating: one entry per allocated table with its id, its
        name and the seats the party takes there (e.g. "2 + 3 + 1 seats").
        Empty when the party does not fit.
      required: [available, split]
      properties:
        available:
          type: boolean
          example: true
        split:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'

    NewBooking:
      type: object
      description: >
        Creates one booking for the authenticated hiker. Party size has no
        configured maximum; available seats are the limit.
      required: [slotId, partySize]
      properties:
        slotId:
          type: integer
          minimum: 1
          example: 3
        partySize:
          type: integer
          minimum: 1
          description: The whole party, the hiker included.
          example: 3
        requirements:
          type: array
          description: >
            Optional party requirements (MH-05); absent or empty = none.
            Maximum number and text length are pending PO (planning question 6).
          items:
            $ref: '#/components/schemas/Requirement'

    Requirement:
      type: object
      description: >
        One requirement for a subset of the party (MH-05). `hasAllergies` is the
        checkbox the hiker ticks when special care is needed in the kitchen;
        `description` says what and for how many (PO issue #29).
      required: [hasAllergies, description]
      properties:
        hasAllergies:
          type: boolean
          example: true
        description:
          type: string
          minLength: 1
          description: Trimmed by the server; empty after trimming is refused.
          example: '1 vegan, peanut allergy'

    SlotSummary:
      type: object
      description: The slot inside a booking.
      required: [id, date, startTime, endTime, label]
      properties:
        id:
          type: integer
          example: 3
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-11-02'
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '19:00'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '20:30'
        label:
          type: string
          example: Dinner - 1st turn

    Allocation:
      type: object
      description: >
        One table's share of a party's seating. `seats` is the number of party
        members at this table, not its capacity. Show hikers the seat split
        (for example, "2 + 3 + 1 seats"), not table names.
      required: [slotTableId, tableName, seats]
      properties:
        slotTableId:
          type: integer
          description: Id of the row in slot_tables, unique within the slot.
          example: 9
        tableName:
          type: string
          example: T2
        seats:
          type: integer
          minimum: 1
          example: 3

    Booking:
      type: object
      required: [id, slot, partySize, tables, requirements, status, createdAt]
      properties:
        id:
          type: integer
          example: 100
        slot:
          $ref: '#/components/schemas/SlotSummary'
        partySize:
          type: integer
          minimum: 1
          example: 3
        tables:
          type: array
          description: >
            Tables assigned to the party (allocation rule) - same shape as
            the `split` of the availability check. Empty for a cancelled booking
            (its seats are free again).
          items:
            $ref: '#/components/schemas/Allocation'
        requirements:
          type: array
          description: The party requirements (MH-05), in the order they were entered; possibly empty.
          items:
            $ref: '#/components/schemas/Requirement'
        status:
          type: string
          description: >
            `confirmed`, or `cancelled` after MH-08 (the booking is kept, its
            seats are free again).
          enum: [confirmed, cancelled]
          example: confirmed
        createdAt:
          type: string
          format: date-time
          description: >
            ISO 8601 UTC, when the booking was made. (The 48-hour change window
            counts from the slot start, not from here: PO issue #43.)
          example: '2026-10-30T09:12:00Z'

    SlotTable:
      type: object
      required: [id, name, seats]
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          description: Table name; may contain letters, numbers, or both.
          example: T1
        seats:
          type: integer
          description: Total seats of the table (not the free ones).
          minimum: 1
          example: 4

    Slot:
      type: object
      description: A slot with its tables, as shown in the weekly view card.
      required: [id, date, startTime, endTime, label, status, past, tables]
      properties:
        id:
          type: integer
          example: 12
        date:
          type: string
          description: Valid calendar date in hut local time.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-11-02'
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '19:00'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '20:30'
        label:
          type: string
          minLength: 1
          example: Dinner - 1st turn
        status:
          type: string
          description: Will be implemented in a future story; for now always `open`
          enum: [open, closed]
          example: open
        past:
          type: boolean
          description: True when the slot start is at or before the current hut-local time.
          example: false
        tables:
          type: array
          items:
            $ref: '#/components/schemas/SlotTable'

    NewSlotTable:
      type: object
      required: [name, seats]
      properties:
        name:
          type: string
          minLength: 1
          description: Table name; may contain letters, numbers, or both.
          example: T1
        seats:
          type: integer
          minimum: 1
          example: 4

    NewSlot:
      type: object
      required: [date, startTime, endTime, label, tables]
      properties:
        date:
          type: string
          description: Valid calendar date in hut local time.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-11-02'
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '19:00'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '20:30'
        label:
          type: string
          minLength: 1
          example: Dinner - 1st turn
        tables:
          type: array
          minItems: 1
          description: At least one table; names unique within the slot.
          items:
            $ref: '#/components/schemas/NewSlotTable'

    MyBooking:
      description: >
        A booking in the hiker's list (MH-06): the Booking plus `changeable`,
        computed by the server with the change rules (not cancelled, at least
        48 hours before the slot starts), so the page never repeats them.
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required: [changeable]
          properties:
            changeable:
              type: boolean
              example: true

    BookingChange:
      type: object
      description: >
        The fields to change (MH-06). At least one; what is not sent stays as
        it is. `requirements` replaces the whole list.
      minProperties: 1
      properties:
        slotId:
          type: integer
          minimum: 1
          example: 4
        partySize:
          type: integer
          minimum: 1
          example: 6
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'

    CopyWeek:
      type: object
      description: >
        Source and target week of a copy (MH-09): any date of each week, the
        server uses their Mondays. Named `sourceWeek`/`targetWeek`, not
        `from`/`to`: in `GET /api/slots`, `from`/`to` are a date range.
      required: [sourceWeek, targetWeek]
      properties:
        sourceWeek:
          type: string
          description: A date of the week to copy (valid calendar date).
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-11-09'
        targetWeek:
          type: string
          description: A date of the week to copy into (valid calendar date).
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-11-16'

    CopyWeekResult:
      type: object
      required: [created, replaced, skipped]
      properties:
        created:
          type: array
          description: The new slots, with their tables, ordered by date then start time.
          items:
            $ref: '#/components/schemas/Slot'
        replaced:
          type: array
          description: >
            The slots of the target week (not started, without bookings) that
            were deleted because the copy replaces the existing schedule
            (PO issue #45). Empty when the target week was empty.
          items:
            $ref: '#/components/schemas/Slot'
        skipped:
          type: array
          description: >
            The source slots that were not copied because their day/time in the
            target week is not in the future.
          items:
            type: object
            required: [date, startTime, endTime, label, reason]
            properties:
              date:
                type: string
                description: The date it would have had in the target week.
                pattern: '^\d{4}-\d{2}-\d{2}$'
                example: '2026-11-16'
              startTime:
                type: string
                pattern: '^\d{2}:\d{2}$'
                example: '12:00'
              endTime:
                type: string
                pattern: '^\d{2}:\d{2}$'
                example: '14:00'
              label:
                type: string
                example: Lunch
              reason:
                type: string
                enum: [past]
                description: >
                  `past`: the day (or the start) is not in the future. (There is
                  no `overlap` reason: the target schedule is replaced, or the
                  copy is refused with 409 if it has bookings.)
                example: past

    HikerSummary:
      type: object
      description: >
        A hiker as shown in the staff search (MH-07). `temporary` is true for a
        hiker created with only a name and an optional phone, who cannot log in.
      required: [id, firstName, lastName, email, phone, temporary]
      properties:
        id:
          type: integer
          example: 4
        firstName:
          type: string
          example: Marco
        lastName:
          type: string
          nullable: true
          example: Rossi
        email:
          type: string
          format: email
          nullable: true
          example: marco.rossi@example.com
        phone:
          type: string
          nullable: true
          example: '+39 333 1234567'
        temporary:
          type: boolean
          example: false

    NewStaffBooking:
      type: object
      description: >
        A booking entered by staff (MH-07). Exactly one of `hikerId`,
        `newHiker` and `temporaryHiker`; the rest as `NewBooking`.
      required: [slotId, partySize]
      properties:
        hikerId:
          type: integer
          minimum: 1
          description: An existing hiker (from GET /api/staff/hikers).
          example: 4
        newHiker:
          $ref: '#/components/schemas/StaffNewHiker'
        temporaryHiker:
          $ref: '#/components/schemas/TemporaryHiker'
        slotId:
          type: integer
          minimum: 1
          example: 3
        partySize:
          type: integer
          minimum: 1
          example: 4
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'

    StaffNewHiker:
      type: object
      description: >
        Full hiker details entered by staff: a regular hiker profile, who can
        later log in. The same fields and checks as `NewUser` **except the
        password**, which staff never choose: the server generates it (PO
        issue #36) and returns it once in `StaffBooking.generatedPassword`.
      required: [firstName, lastName, email, phone]
      properties:
        firstName:
          type: string
          minLength: 1
          example: Paolo
        lastName:
          type: string
          minLength: 1
          example: Neri
        email:
          type: string
          format: email
          example: paolo.neri@example.com
        phone:
          type: string
          format: phone number
          example: '+39 333 5551234'
        notes:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true

    TemporaryHiker:
      type: object
      description: >
        Quick entry (MH-07, PO issue #5): a name and an optional phone. Creates
        a temporary hiker with no email and no password, who cannot log in.
      required: [firstName]
      properties:
        firstName:
          type: string
          minLength: 1
          example: Giulia
        lastName:
          type: string
          nullable: true
          example: Bianchi
        phone:
          type: string
          nullable: true
          example: '+39 333 7654321'

    StaffBooking:
      description: >
        The booking created by staff, with the hiker it is for; plus the
        generated password when a new full hiker was created.
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required: [hiker]
          properties:
            hiker:
              $ref: '#/components/schemas/HikerSummary'
            generatedPassword:
              type: string
              description: >
                Only when `newHiker` was sent: the random password of the new
                account, returned this once for the staff member to give to the
                hiker (PO issue #36). Stored only hashed, never returned again.
              example: k7Qp2xWm9aTz

    CapturedEmail:
      type: object
      description: Email stored by the test/E2E mailer instead of being sent.
      required: [to, subject, text, sentAt]
      properties:
        to:
          type: string
          format: email
          example: mario.rossi@example.com
        subject:
          type: string
          example: 'Your booking at the mountain hut is confirmed'
        text:
          type: string
          description: >
            One email per booking event (PO issue #41): booking confirmed,
            changed (with the new details) or cancelled. The body includes the
            booking reference, hiker name, slot date and time, party size and
            party requirements when present (MH-05; a requirement with
            allergies is marked as such). It does not include table numbers.
        sentAt:
          type: string
          format: date-time
          example: '2026-10-30T09:12:01Z'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Not found